<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Arthur Pereira - Cloud Security" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232228"/>
      <stop offset="1" stop-color="#46444D"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#54BB3E" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54BB3E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#54BB3E" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#54BB3E" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="320" rx="14"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Courier New', Consolas, monospace; }
    .log   { font-size: 14px; fill: #54BB3E; opacity: 0; }
    .l1 { animation: k1 12s infinite; }
    .l2 { animation: k2 12s infinite; }
    .l3 { animation: k3 12s infinite; }
    .l4 { animation: k4 12s infinite; }
    .l5 { animation: k5 12s infinite; }
    .bar   { transform-box: fill-box; transform-origin: left center; animation: kb 12s infinite; }
    .title { opacity: 0; animation: kt 12s infinite; }
    .sub   { opacity: 0; animation: ks 12s infinite; }
    .on    { opacity: 0; animation: ko 12s infinite; }
    .scan  { animation: sc 5s linear infinite; }
    .cur   { animation: kc 1s steps(1) infinite; }

    @keyframes k1 { 0%,2%{opacity:0} 4%,90%{opacity:1} 96%,100%{opacity:0} }
    @keyframes k2 { 0%,9%{opacity:0} 11%,90%{opacity:1} 96%,100%{opacity:0} }
    @keyframes k3 { 0%,16%{opacity:0} 18%,90%{opacity:1} 96%,100%{opacity:0} }
    @keyframes k4 { 0%,23%{opacity:0} 25%,90%{opacity:1} 96%,100%{opacity:0} }
    @keyframes k5 { 0%,30%{opacity:0} 32%,90%{opacity:1} 96%,100%{opacity:0} }
    @keyframes kb { 0%,32%{transform:scaleX(0)} 50%,94%{transform:scaleX(1)} 100%{transform:scaleX(0)} }
    @keyframes kt { 0%,50%{opacity:0} 56%,90%{opacity:1} 96%,100%{opacity:0} }
    @keyframes ks { 0%,58%{opacity:0} 64%,90%{opacity:1} 96%,100%{opacity:0} }
    @keyframes ko { 0%,62%{opacity:0} 64%{opacity:1} 68%{opacity:.3} 72%,90%{opacity:1} 96%,100%{opacity:0} }
    @keyframes sc { 0%{transform:translateY(-80px)} 100%{transform:translateY(340px)} }
    @keyframes kc { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <rect class="scan" x="0" y="0" width="1000" height="80" fill="url(#scan)"/>
  </g>

  <!-- frame + corner brackets -->
  <rect x="1" y="1" width="998" height="318" rx="14" fill="none" stroke="#116600" stroke-width="2"/>
  <g fill="none" stroke="#54BB3E" stroke-width="3" stroke-linecap="round">
    <path d="M18 46V18H46"/>
    <path d="M954 18H982V46"/>
    <path d="M18 274V302H46"/>
    <path d="M954 302H982V274"/>
  </g>

  <!-- boot log -->
  <text class="log l1" x="40" y="52">&gt; BOOTING PEREIRASEC_OS v1.0 ...</text>
  <text class="log l2" x="40" y="76">&gt; LOADING MODULES ............ [ OK ]</text>
  <text class="log l3" x="40" y="100">&gt; CLOUD_SECURITY.CORE ......... [ OK ]</text>
  <text class="log l4" x="40" y="124">&gt; DATA_ANALYSIS + LGPD ........ [ OK ]</text>
  <text class="log l5" x="40" y="148">&gt; AUTHENTICATING USER: ARTHUR PEREIRA</text>

  <text class="on" x="960" y="52" text-anchor="end" font-size="14" font-weight="bold" fill="#54BB3E" filter="url(#glow)">&#9679; SYSTEM ONLINE</text>

  <!-- progress bar -->
  <rect x="40" y="166" width="920" height="6" rx="3" fill="#116600" fill-opacity="0.55"/>
  <rect class="bar" x="40" y="166" width="920" height="6" rx="3" fill="#54BB3E" filter="url(#glow)"/>

  <!-- title -->
  <g class="title" filter="url(#glow)">
    <text x="500" y="240" text-anchor="middle" font-size="54" font-weight="bold" letter-spacing="8" fill="#54BB3E">ARTHUR PEREIRA</text>
  </g>
  <g class="sub">
    <text x="500" y="282" text-anchor="middle" font-size="16" letter-spacing="3" fill="#E4E4E4">CLOUD SECURITY ENTHUSIAST  ·  DATA  ·  LGPD</text>
    <rect class="cur" x="768" y="268" width="9" height="16" fill="#54BB3E"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
