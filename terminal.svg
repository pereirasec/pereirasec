<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Objetivos atuais em formato de terminal" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="win"><rect width="900" height="290" rx="12"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Courier New', Consolas, monospace; font-size: 15px; }
    .ln { opacity: 0; }
    .a1 { animation: t1 14s infinite; }
    .a2 { animation: t2 14s infinite; }
    .a3 { animation: t3 14s infinite; }
    .a4 { animation: t4 14s infinite; }
    .a5 { animation: t5 14s infinite; }
    .a6 { animation: t6 14s infinite; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes t1 { 0%,3%{opacity:0} 5%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes t2 { 0%,12%{opacity:0} 14%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes t3 { 0%,20%{opacity:0} 22%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes t4 { 0%,28%{opacity:0} 30%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes t5 { 0%,40%{opacity:0} 42%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes t6 { 0%,50%{opacity:0} 52%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style>

  <g clip-path="url(#win)">
    <rect width="900" height="290" fill="#2b2a30"/>
    <rect width="900" height="38" fill="#46444D"/>
  </g>
  <rect x="1" y="1" width="898" height="288" rx="12" fill="none" stroke="#116600" stroke-width="2"/>

  <circle cx="26" cy="19" r="6" fill="#116600"/>
  <circle cx="48" cy="19" r="6" fill="#54BB3E"/>
  <circle cx="70" cy="19" r="6" fill="#8f8d98"/>
  <text x="450" y="24" text-anchor="middle" font-size="13" fill="#d6d6d6">pereirasec@cloud-security: ~</text>

  <g class="ln a1">
    <text x="30" y="80"><tspan fill="#54BB3E">arthur@pereirasec:~$</tspan><tspan fill="#f0f0f0"> cat objetivos.md</tspan></text>
  </g>
  <g class="ln a2">
    <text x="30" y="110"><tspan fill="#54BB3E">[ ]</tspan><tspan fill="#f0f0f0"> Estudar mais sobre nuvem e segurança de nuvem</tspan></text>
  </g>
  <g class="ln a3">
    <text x="30" y="140"><tspan fill="#54BB3E">[ ]</tspan><tspan fill="#f0f0f0"> Conseguir um estágio em área introdutória</tspan></text>
  </g>
  <g class="ln a4">
    <text x="30" y="170" fill="#9d9ba6"># EN: study cloud and cloud security / land an entry-level internship</text>
  </g>
  <g class="ln a5">
    <text x="30" y="210"><tspan fill="#54BB3E">arthur@pereirasec:~$</tspan><tspan fill="#f0f0f0"> status --current</tspan></text>
  </g>
  <g class="ln a6">
    <text x="30" y="240" fill="#54BB3E">&gt; aprendendo · construindo · evoluindo</text>
    <rect class="cur" x="352" y="227" width="9" height="17" fill="#54BB3E"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
